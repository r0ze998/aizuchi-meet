<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Aizuchi マイク許可</title><link rel="stylesheet" href="sidepanel.css"><style>body{max-width:560px;margin:40px auto;padding:16px}</style></head>
<body>
<h1 style="font-size:18px">自分のマイクの許可（任意）</h1>
<p>自分の発言を文脈に入れたい場合だけ、このページでマイクの使用を許可します。相手の音声とは別経路・別ラベルで扱い、会議の再生には混ぜません。許可しなくても相手の音声の取得・翻訳・候補表示は使えます。</p>
<button id="btn" class="primary">マイクの使用を許可する</button>
<p id="out" class="muted"></p>
<script type="module">
document.getElementById('btn').addEventListener('click', async () => {
  const out = document.getElementById('out');
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    s.getTracks().forEach((t) => t.stop());
    out.textContent = '許可されました。サイドパネルの「自分のマイクを使う」をオンにできます。このタブは閉じて構いません。';
  } catch (e) { out.textContent = `許可されませんでした: ${e.name}`; }
});
</script>
</body></html>
